# SonarCloud project configuration.
#
# Exclude sources that are not maintained by dune-gdt from analysis. Their findings are
# somebody else's concern and cannot be fixed from this repository:
#   - mathexpr.{cc,hh}: math expression parser, Copyright Yann Ollivier 1997-2000
#     (e.g. cpp:S6069 sprintf, cpp:S5813 buffer handling)
#   - dune/xt/test/gtest/**: bundled GoogleTest
#   - deps/scripts/**: a git submodule of github.com/dune-gdt/scripts, i.e. a separate
#     repository that merely happens to sit inside this checkout. It accounted for 35 open
#     HIGH/BLOCKER findings (pythonsecurity:S8707, shelldre:S7688, python:S3776, ...) that
#     no change here can resolve; they belong on the scripts repo.
#   - cmake/modules/versioneer.py: python-versioneer 0.19, generated/vendored upstream
#     tooling (Public Domain), regenerated rather than edited (python:S1192)
#
# The same exclusion is also configured on the SonarCloud project itself so it
# takes effect under Automatic Analysis; this file keeps it under version control
# and applies it to CI-based scans.
sonar.projectKey=dune-gdt_dune-gdt
sonar.organization=dune-gdt

sonar.exclusions=dune/xt/functions/expression/mathexpr.cc,dune/xt/functions/expression/mathexpr.hh,dune/xt/test/gtest/**,deps/scripts/**,cmake/modules/versioneer.py

# Explicitly declare the test directories so SonarCloud analyzes them as test
# code (test rule profile, excluded from coverage-of-sources expectations)
# rather than as main sources.
sonar.tests=dune/gdt/test,dune/xt/test,python/gdt/test,python/xt/test

# Test files are intentionally repetitive (multiple similar test methods are expected; the Python
# hypothesis suites additionally keep each module self-contained, repeating small grid/operator
# helper functions rather than sharing them). Exclude every declared test directory from copy-paste
# detection so structural test patterns don't trip the gate.
sonar.cpd.exclusions=dune/gdt/test/**,dune/xt/test/**,python/gdt/test/**,python/xt/test/**
