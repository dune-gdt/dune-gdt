# SonarCloud project configuration.
#
# Exclude vendored third-party sources from analysis. These files are not
# maintained by dune-gdt and their findings (e.g. cpp:S6069 sprintf, cpp:S5813
# buffer handling) are upstream concerns:
#   - mathexpr.{cc,hh}: math expression parser, Copyright Yann Ollivier 1997-2000
#   - dune/xt/test/gtest/**: bundled GoogleTest
#
# The same exclusion is also configured on the SonarCloud project itself so it
# takes effect under Automatic Analysis; this file keeps it under version control
# and applies it to CI-based scans.
sonar.projectKey=dune-gdt_dune-gdt
sonar.organization=dune-gdt

sonar.exclusions=dune/xt/functions/expression/mathexpr.cc,dune/xt/functions/expression/mathexpr.hh,dune/xt/test/gtest/**

# Explicitly declare the test directories so SonarCloud analyzes them as test
# code (test rule profile, excluded from coverage-of-sources expectations)
# rather than as main sources.
sonar.tests=dune/gdt/test,dune/xt/test,python/gdt/test,python/xt/test

# Test files are intentionally repetitive (multiple similar test methods are expected; the Python
# hypothesis suites additionally keep each module self-contained, repeating small grid/operator
# helper functions rather than sharing them). Exclude every declared test directory from copy-paste
# detection so structural test patterns don't trip the gate.
sonar.cpd.exclusions=dune/gdt/test/**,dune/xt/test/**,python/gdt/test/**,python/xt/test/**

# ---------------------------------------------------------------------------
# Issue exclusions.
#
# Everything below is a rule whose premise does not hold for this codebase, not
# a backlog. Each entry names why. As with sonar.exclusions above, these must
# also be configured on the SonarCloud project itself to take effect under
# Automatic Analysis.
#
# NOT listed here on purpose, because they are real debt rather than noise:
#   - cpp:S3776 / cpp:S134 (cognitive complexity, nesting): legitimate, just
#     expensive to refactor in working numerical code.
#   - cpp:S3470 in fix-ambiguous-std-math-overloads.cc and dune/xt/test/common.hh:
#     declarations in namespace std really are undefined behaviour. Deliberate,
#     but still owed a proper fix.
#   - cpp:S5025 / cpp:S1186 / cpp:S3608: tracked as GitHub issues instead.
sonar.issue.ignore.multicriteria=idiom1,idiom2,idiom3,fp1,fp2,fp3,fp4,fp5,fp6,fp7,fp8

# Mutable members are lazy-evaluation caches on element-local objects (integrands,
# operators, eigen solvers). These are copied per thread by the assembler rather
# than shared, so there is no race to guard; a mutex would only add overhead to
# the innermost assembly loop.
sonar.issue.ignore.multicriteria.idiom1.ruleKey=cpp:S8379
sonar.issue.ignore.multicriteria.idiom1.resourceKey=**/*

# Implicit conversion is the interface. XT::Functions::GridFunction deliberately
# converts from scalars, functions and grid functions so that callers can pass any
# of them where a grid function is expected; likewise FieldVector/FieldMatrix
# wrappers and Common::Parameter.
sonar.issue.ignore.multicriteria.idiom2.ruleKey=cpp:S1709
sonar.issue.ignore.multicriteria.idiom2.resourceKey=**/*

# protected data members are how DUNE's CRTP and interface base classes hand state
# to their implementations.
sonar.issue.ignore.multicriteria.idiom3.ruleKey=cpp:S3656
sonar.issue.ignore.multicriteria.idiom3.resourceKey=**/*

# All flagged macros are conditional-compilation switches, not values:
# DUNE_XT_COMMON_TEST_MAIN_* are read by #ifndef/#if in dune/xt/test/main.hxx,
# SIMPLEXGRID_*_AVAILABLE by #if in grids.hh, CPP17_PARALLELISM_TS_SUPPORTED by
# #if in numeric.hh, GTEST_DONT_DEFINE_TEST by gtest. constexpr is invisible to
# the preprocessor.
sonar.issue.ignore.multicriteria.fp1.ruleKey=cpp:S5028
sonar.issue.ignore.multicriteria.fp1.resourceKey=**/*

# `from pymor.basic import *` is the documented pyMOR idiom for demo scripts; the
# files already carry an explicit "# ruff: noqa: F403, F405" marker saying so.
sonar.issue.ignore.multicriteria.fp2.ruleKey=python:S2208
sonar.issue.ignore.multicriteria.fp2.resourceKey=examples/**

# LockGuard and VectorLockGuard *are* the RAII wrapper the rule asks for: they
# lock in the constructor and unlock in the destructor, which is what trips
# S5506 ("use RAII instead of calling lock() explicitly") and S8473 ("balance the
# locks and unlocks in this conditional branch").
sonar.issue.ignore.multicriteria.fp3.ruleKey=cpp:S5506
sonar.issue.ignore.multicriteria.fp3.resourceKey=dune/xt/la/container/container-interface.hh
sonar.issue.ignore.multicriteria.fp4.ruleKey=cpp:S8473
sonar.issue.ignore.multicriteria.fp4.resourceKey=dune/xt/la/container/container-interface.hh

# The std::recursive_mutex is required, and the code says why in a five-line
# comment: CHECK_CRTP detects a missing override by re-entering the interface
# method while this thread still holds the lock. A plain std::mutex would
# deadlock instead of throwing CRTP_check_failed.
sonar.issue.ignore.multicriteria.fp5.ruleKey=cpp:S8462
sonar.issue.ignore.multicriteria.fp5.resourceKey=dune/xt/common/crtp.hh

# void* is the CBLAS C ABI.
sonar.issue.ignore.multicriteria.fp6.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.fp6.resourceKey=dune/xt/common/cblas.cc

# These globals cannot be const. handler_invocations/last_signal are volatile
# sig_atomic_t written from a signal handler, and test_out is a std::ostream&.
sonar.issue.ignore.multicriteria.fp7.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.fp7.resourceKey=dune/xt/test/common/*.cc

# dev_null is a writable null log stream by construction. It is inline (one per
# program) as of the batch A fix, but a log stream is not a constant.
sonar.issue.ignore.multicriteria.fp8.ruleKey=cpp:S5421
sonar.issue.ignore.multicriteria.fp8.resourceKey=dune/xt/common/logstreams.hh
